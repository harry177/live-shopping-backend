version: "3.9"

services:
  api:
    build:
      context: ./apps/api
    container_name: live-shopping-api
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./recordings:/recordings
    restart: unless-stopped
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:latest
    container_name: live-shopping-livekit
    command: --config /etc/livekit.yaml
    env_file:
      - .env
    ports:
      - "7880:7880"
      - "7881:7881"
      - "51000-51100:51000-51100/udp"
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped
    depends_on:
      - redis
      - coturn

  egress:
    image: livekit/egress:latest
    container_name: live-shopping-egress
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    shm_size: "1gb"
    volumes:
    - ./infra/egress/egress.yaml:/etc/egress.yaml
    - ./recordings:/recordings
    restart: unless-stopped
    depends_on:
    - redis
    - livekit
    - srs

  redis:
    image: redis:7-alpine
    container_name: live-shopping-redis
    restart: unless-stopped    

  coturn:
    image: coturn/coturn:latest
    container_name: live-shopping-coturn
    command: -c /etc/turnserver.conf
    env_file:
      - .env
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/turnserver.conf
    restart: unless-stopped

  srs:
    image: ossrs/srs:5
    container_name: live-shopping-srs
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./infra/srs/srs.conf:/usr/local/srs/conf/srs.conf
      - ./infra/srs/hls:/usr/local/srs/objs/nginx/html/live
    command: ./objs/srs -c conf/srs.conf
    restart: unless-stopped